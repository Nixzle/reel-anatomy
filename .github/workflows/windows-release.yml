name: Test and package Windows
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Unit and synthetic video tests
        run: python -m unittest -v test_app
      - name: Bundle offline English speech model
        shell: pwsh
        run: |
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-base.en', local_dir='models/base.en')"
      - name: Build self-contained Windows directory
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --name ReelAnatomy --add-data "web;web" --add-data "models/base.en;models/base.en" --collect-all faster_whisper --collect-all ctranslate2 --collect-all imageio_ffmpeg app.py
          Copy-Item README.md dist/ReelAnatomy/README.md
          Copy-Item LICENSE dist/ReelAnatomy/LICENSE
          Compress-Archive -Path dist/ReelAnatomy -DestinationPath dist/ReelAnatomy-Windows-x64.zip -Force
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $env:REEL_ANATOMY_PORT = "18865"
          $env:REEL_ANATOMY_NO_BROWSER = "1"
          $env:REEL_ANATOMY_HOME = Join-Path $env:RUNNER_TEMP "ReelAnatomySmoke"
          $p = Start-Process -FilePath "dist/ReelAnatomy/ReelAnatomy.exe" -PassThru
          try {
            $healthy = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:18865/api/health" -TimeoutSec 2
                if ($health.ok -and $health.ffmpeg -and $health.speech) { $healthy = $true; break }
              } catch {}
            }
            if (-not $healthy) { throw "Packaged app health check failed" }
          } finally { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
      - uses: actions/upload-artifact@v4
        with:
          name: ReelAnatomy-Windows-x64
          path: dist/ReelAnatomy-Windows-x64.zip
      - name: Attach zip to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/ReelAnatomy-Windows-x64.zip --title "Reel Anatomy ${{ github.ref_name }}" --notes "Local-first video, transcript, and shot-analysis Windows package with offline English speech model. See README and limitations." --latest
