name: Verify and package Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare pinned offline English model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='Systran/faster-whisper-base.en', revision='3d3d5dee26484f91867d81cb899cfcf72b96be6c', local_dir='models/base.en')"
      - name: Python and frontend regressions
        run: |
          python -m unittest -v test_app test_reliability
          node test_frontend.cjs
      - name: Build and exercise portable executable
        run: python scripts/package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: ReelAnatomy-Windows-x64
          path: |
            dist/ReelAnatomy-Windows-x64.zip
            dist/SHA256SUMS.txt
            .local/resume-20261022/packaged-smoke.json
